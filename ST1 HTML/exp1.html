<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>BUS RESERVATION FORM</h1>
    <label for="name">NAME</label>
    <input id="name" type="text" placeholder="NAME">
    <br>
    <br>
    <label for="e-mail">E-MAIL</label>
    <input id="e-mail" type="text" placeholder="E-MAIL">
    <br>
    <br>
    <label for="phone">PHONE</label>
    <input id="phone" type="phone" placeholder="phone">
    <br>
    <br>
    <h4>RESERVATION DATE</h4>
    <label for="reservation date">RESERVATION DATE</label>
    <input id="reservation date" type="date" required>

    <h4>BUS TYPE</h4>
    <label for="BUS TYPE">BUS TYPE</label>
    <select id="BUS TYPE" required>
        <option value=" ">SELECT BUS TYPE</option>
        <option value="SLEEPER NON-AC">SLEEPER NON-AC</option>
        <option value="SLEEPER AC">SLEEPER AC</option>
        <option value="SINGLE SEATER">SINGLE SEATER</option>
        <option value="DOUBLE SEATER">DOUBLE SEATER</option>
        <option value="TRIPLE SEATER">TRIPLE SEATER</option>
<br>
<br><br>
<div>
    <br><br>
        <input id="solo" type="radio" name="bus type" value="solo">
        <label for="solo"> solo</label>
        <input id="double" type="radio" name="bus type" value="double">
        <label for="double">double</label>
<input id="family" type="radio" name="bus type" value="family">
        <label for="family">family</label>
<br><br>
</div>
<input id="terms" type="checkbox" required>
<label for="terms">i have read all terms and conditions</label>
<br><br>
<input type="SUBMIT" value="SUBMIT">
<input type="RESET" value="RESET">







    



</body>
</html>
